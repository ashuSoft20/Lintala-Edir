<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Mutual Aid Association</title>
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#c3c9cf;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .login-box{
      background:white;
      padding:40px;
      width:400px;
      border-radius:14px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .login-box h2{
      text-align:center;
      margin-bottom:25px;
      color:#0f766e;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
    }

    .btn{
      width:100%;
      padding:12px;
      background:#0f766e;
      color:white;
      border:none;
      border-radius:8px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn:hover{
      background:#0d5f59;
    }

    .back-home{
      display:block;
      text-align:center;
      margin-top:15px;
      text-decoration:none;
      color:#0f766e;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>👤 Welcome!</h2>

    <!-- Points to the backend PHP processing file -->
    <form method="POST" action="Login.php">
      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn">Login</button>
    </form>

    <a href="index.html" class="back-home">← Back to Home</a>
  </div>

</body>
</html>
